[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-warrant-poc"
version = "0.1.0"
description = "Proof-of-concept for clinical warrant response decision support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]
collect = ["beautifulsoup4>=4.12,<5"]
model = [
    "sentence-transformers==6.3.0",
    "transformers==5.20.2",
    "torch==2.14.1",
]

[project.scripts]
clinical-warrant = "clinical_warrant.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clinical_warrant.data" = ["*.json", "context_intake/categories/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
